name: Deploy Yocare Live source registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yocare-live-registry-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply additive D1 migrations
        run: npx --yes wrangler@4.155.0 d1 migrations apply yocare-live-registry --remote --config api/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set registry admin token
        shell: bash
        env:
          REGISTRY_ADMIN_TOKEN: ${{ secrets.REGISTRY_ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$REGISTRY_ADMIN_TOKEN" ]; then
            echo "Add the REGISTRY_ADMIN_TOKEN GitHub Actions secret before deploying the registry."
            exit 1
          fi
          printf '%s' "$REGISTRY_ADMIN_TOKEN" | npx --yes wrangler@4.155.0 secret put REGISTRY_ADMIN_TOKEN --config api/wrangler.jsonc

      - name: Deploy source registry worker
        run: npx --yes wrangler@4.155.0 deploy --config api/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
