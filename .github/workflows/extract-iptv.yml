name: Extract IPTV ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify archive and extract safely
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile

          archive = Path("iptv-master.zip")
          if not archive.is_file():
              raise SystemExit(
                  "iptv-master.zip is missing from the checked-out main branch. "
                  "Confirm the archive has been committed to the repository root."
              )

          destination = Path("iptv-source")
          if destination.exists() and any(destination.iterdir()):
              raise SystemExit(
                  "iptv-source already contains files. Stop to avoid overwriting them."
              )
          destination.mkdir(exist_ok=True)

          try:
              with ZipFile(archive) as z:
                  entries = z.infolist()
                  if not entries:
                      raise SystemExit("The ZIP archive is empty.")

                  root = destination.resolve()
                  for item in entries:
                      name = item.filename.replace("\\", "/")
                      path = PurePosixPath(name)
                      if path.is_absolute() or ".." in path.parts:
                          raise SystemExit(f"Unsafe ZIP path: {item.filename}")
                      target = (destination / Path(*path.parts)).resolve()
                      if target != root and root not in target.parents:
                          raise SystemExit(f"Unsafe extraction target: {item.filename}")

                  z.extractall(destination)

          except BadZipFile:
              raise SystemExit("iptv-master.zip is not a valid ZIP archive.")

          print(f"Extracted {len(entries)} archive entries into {destination}")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv-source
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
            exit 0
          fi
          git commit -m "Extract IPTV source archive"
          git push origin HEAD:main
