
name: Extract IPTV ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("iptv-master.zip")
          if not archive.exists():
              raise SystemExit("iptv-master.zip was not found at repository root.")

          destination = Path("iptv-source")
          destination.mkdir(exist_ok=True)

          with ZipFile(archive) as z:
              for item in z.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
                  target = (destination / path).resolve()
                  if destination.resolve() not in target.parents and target != destination.resolve():
                      raise SystemExit(f"Unsafe extraction target: {item.filename}")
              z.extractall(destination)

          print(f"Extracted files into {destination}")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv-source
          git diff --cached --quiet || git commit -m "Extract IPTV source archive"
          git push
